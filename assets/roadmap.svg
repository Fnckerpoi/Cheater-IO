<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Cheater-IO 路线图</title><desc id="desc">设备扩展路线与企业业务系统规划方向</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192b"/><stop offset="1" stop-color="#172b3b"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#42d6c5"/><stop offset="1" stop-color="#62a9ff"/></linearGradient><style>.t{font-family:Inter,-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif;fill:#f4f7fb}.muted{fill:#a9bacb}.small{font-size:21px}.card{fill:#1b2a3d;stroke:#31455b;stroke-width:2}.tag{font-size:17px;font-weight:700;letter-spacing:1px}</style></defs>
<rect width="1600" height="1000" rx="34" fill="url(#bg)"/><circle cx="1430" cy="75" r="190" fill="#25688a" opacity=".12"/><circle cx="90" cy="900" r="230" fill="#24b89f" opacity=".08"/>
<text class="t" x="100" y="110" font-size="24" font-weight="700" fill="#55d8c7">CHEATER-IO · ROADMAP</text><text class="t" x="100" y="183" font-size="52" font-weight="750">从眼镜扩展，走向业务能力系统</text><text class="t muted" x="100" y="230" font-size="23">现有设备路线与新增探索方向 · 路线图表达规划，不等同于交付承诺</text>
<text class="t" x="100" y="310" font-size="25" font-weight="700">01 / 设备与宿主扩展</text><path d="M130 380H1460" stroke="#40546b" stroke-width="3"/><path d="M155 380H1015" stroke="url(#accent)" stroke-width="4"/>
<g><circle cx="170" cy="380" r="12" fill="#55d8c7"/><rect class="card" x="100" y="420" width="410" height="185" rx="20"/><text class="t" x="132" y="466" font-size="28" font-weight="700">Android · ESP32</text><text class="t muted small" x="132" y="510">宿主扩展与 SCADA 定制</text><text class="t muted small" x="132" y="547">环境遥测 · 事实字幕 · 设备联动</text><text class="t" x="132" y="583" font-size="16" fill="#55d8c7">当前分支 · android</text></g>
<g><circle cx="720" cy="380" r="12" fill="#62a9ff"/><rect class="card" x="565" y="420" width="410" height="185" rx="20"/><text class="t" x="597" y="466" font-size="28" font-weight="700">iOS V1</text><text class="t muted small" x="597" y="510">独立 SDK 与示例客户端</text><text class="t muted small" x="597" y="547">独立客户端技术路线</text><text class="t" x="597" y="583" font-size="16" fill="#8dbdff">独立分支 · ios-v1</text></g>
<g><circle cx="1270" cy="380" r="12" fill="#62a9ff"/><rect class="card" x="1030" y="420" width="470" height="185" rx="20"/><text class="t" x="1062" y="466" font-size="28" font-weight="700">iOS V2</text><text class="t muted small" x="1062" y="510">兼容官方 App 副本的扩展</text><text class="t muted small" x="1062" y="547">复用宿主能力 · 并行演进</text><text class="t" x="1062" y="583" font-size="16" fill="#8dbdff">独立分支 · ios-v2</text></g>
<text class="t" x="100" y="690" font-size="25" font-weight="700">02 / 新增规划方向</text><rect x="100" y="730" width="1400" height="185" rx="24" fill="#1b2c3d" stroke="#42d6c5" stroke-width="2"/><rect x="100" y="730" width="12" height="185" rx="6" fill="url(#accent)"/><text class="t" x="145" y="786" font-size="32" font-weight="750">DSH 创造模式 × 低代码元数据驱动架构</text><rect x="1234" y="751" width="220" height="42" rx="21" fill="#25483f"/><text class="t tag" x="1261" y="779" fill="#7ae2cf">探索 / 规划中</text><text class="t muted" x="145" y="833" font-size="23">重构实现 EBC（企业业务能力系统）与 MOM（制造运营管理系统）</text><text class="t muted" x="145" y="873" font-size="19">方向：以元数据驱动业务模型与流程配置，结合 DSH 创造模式加速构建、迭代与协作。</text>
<text class="t muted" x="100" y="963" font-size="16">路线关系示意 · android / ios-v1 / ios-v2 为并行分支；EBC / MOM 为新增规划方向</text></svg>