<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Cheater-IO 路线图</title><desc id="desc">MOM 与 EBC+商务两条核心路线，以及已完成能力和待办事项</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192b"/><stop offset="1" stop-color="#172b3b"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#42d6c5"/><stop offset="1" stop-color="#62a9ff"/></linearGradient><style>.t{font-family:Inter,-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif;fill:#f4f7fb}.muted{fill:#a9bacb}.small{font-size:21px}.card{fill:#1b2a3d;stroke:#31455b;stroke-width:2}.tag{font-size:17px;font-weight:700;letter-spacing:1px}</style></defs>
<rect width="1600" height="1000" rx="34" fill="url(#bg)"/><circle cx="1430" cy="75" r="190" fill="#25688a" opacity=".12"/><circle cx="90" cy="900" r="230" fill="#24b89f" opacity=".08"/>
<text class="t" x="100" y="100" font-size="24" font-weight="700" fill="#55d8c7">CHEATER-IO · ANDROID ROADMAP</text><text class="t" x="100" y="168" font-size="50" font-weight="750">从眼镜扩展，走向业务能力系统</text><text class="t muted" x="100" y="212" font-size="22">两条核心路线 · 路线图表达规划，不等同于交付承诺</text>
<text class="t" x="100" y="282" font-size="25" font-weight="700">01 / 核心路线</text>
<g><rect class="card" x="100" y="306" width="680" height="190" rx="22" stroke="#42d6c5"/><rect x="100" y="306" width="12" height="190" rx="6" fill="url(#accent)"/><text class="t" x="140" y="360" font-size="34" font-weight="750">MOM</text><text class="t muted small" x="140" y="408">制造运营管理系统</text><text class="t muted" x="140" y="446" font-size="19">基于 DSH 创造模式与低代码元数据驱动架构重构实现</text><text class="t" x="140" y="478" font-size="16" fill="#55d8c7">核心路线 A</text></g>
<g><rect class="card" x="820" y="306" width="680" height="190" rx="22" stroke="#62a9ff"/><rect x="820" y="306" width="12" height="190" rx="6" fill="url(#accent)"/><text class="t" x="860" y="360" font-size="34" font-weight="750">EBC + 商务</text><text class="t muted small" x="860" y="408">企业业务能力系统与商务</text><text class="t muted" x="860" y="446" font-size="19">以元数据驱动业务模型与流程配置</text><text class="t" x="860" y="478" font-size="16" fill="#8dbdff">核心路线 B</text></g>
<text class="t" x="100" y="560" font-size="25" font-weight="700">02 / 能力进展</text><path d="M230 600H1370" stroke="#40546b" stroke-width="3" stroke-dasharray="10 8"/><path d="M230 600H800" stroke="#55d8c7" stroke-width="4"/>
<g><circle cx="230" cy="600" r="12" fill="#55d8c7" stroke="#55d8c7" stroke-width="3"/><rect class="card" x="100" y="640" width="260" height="250" rx="20"/><rect x="124" y="662" width="92" height="32" rx="16" fill="#25483f"/><text class="t tag" x="138" y="684" fill="#7ae2cf">已完成</text><text class="t" x="124" y="740" font-size="25" font-weight="700">私有本地模型</text><text class="t" x="124" y="774" font-size="25" font-weight="700">部署接入</text><text class="t muted" x="124" y="830" font-size="18">自有模型走 OpenAI 兼容</text><text class="t muted" x="124" y="858" font-size="18">HTTP(S)/SSE 接口</text></g>
<g><circle cx="515" cy="600" r="12" fill="#55d8c7" stroke="#55d8c7" stroke-width="3"/><rect class="card" x="385" y="640" width="260" height="250" rx="20"/><rect x="409" y="662" width="92" height="32" rx="16" fill="#25483f"/><text class="t tag" x="423" y="684" fill="#7ae2cf">已完成</text><text class="t" x="409" y="740" font-size="25" font-weight="700">电脑 Agent</text><text class="t" x="409" y="774" font-size="25" font-weight="700">交互协同接入</text><text class="t muted" x="409" y="830" font-size="18">眼镜语音派发任务</text><text class="t muted" x="409" y="858" font-size="18">到电脑端 DSH Agent</text></g>
<g><circle cx="800" cy="600" r="12" fill="#55d8c7" stroke="#55d8c7" stroke-width="3"/><rect class="card" x="670" y="640" width="260" height="250" rx="20"/><rect x="694" y="662" width="92" height="32" rx="16" fill="#25483f"/><text class="t tag" x="708" y="684" fill="#7ae2cf">已完成</text><text class="t" x="694" y="740" font-size="25" font-weight="700">知识库接入</text><text class="t" x="694" y="774" font-size="25" font-weight="700">Cortrix MCP</text><text class="t muted" x="694" y="830" font-size="18">按需检索并依据</text><text class="t muted" x="694" y="858" font-size="18">证据正文作答</text></g>
<g><circle cx="1085" cy="600" r="12" fill="#10192b" stroke="#8a9bb0" stroke-width="3"/><rect class="card" x="955" y="640" width="260" height="250" rx="20" stroke-dasharray="8 6"/><rect x="979" y="662" width="70" height="32" rx="16" fill="#2a3546"/><text class="t tag" x="993" y="684" fill="#b4c2d2">待办</text><text class="t" x="979" y="740" font-size="25" font-weight="700">实时提示功能</text><text class="t" x="979" y="774" font-size="25" font-weight="700">接入知识库</text><text class="t muted" x="979" y="830" font-size="18">推屏前检索知识库</text><text class="t muted" x="979" y="858" font-size="18">并重新生成回答</text></g>
<g><circle cx="1370" cy="600" r="12" fill="#10192b" stroke="#8a9bb0" stroke-width="3"/><rect class="card" x="1240" y="640" width="260" height="250" rx="20" stroke-dasharray="8 6"/><rect x="1264" y="662" width="70" height="32" rx="16" fill="#2a3546"/><text class="t tag" x="1278" y="684" fill="#b4c2d2">待办</text><text class="t" x="1264" y="740" font-size="25" font-weight="700">主页常驻看板</text><text class="t" x="1264" y="774" font-size="25" font-weight="700">Agent 交互组件</text><text class="t muted" x="1264" y="830" font-size="18">电脑 Agent 的</text><text class="t muted" x="1264" y="858" font-size="18">眼镜常驻 UI 组件</text></g>
<text class="t muted" x="100" y="955" font-size="16">实线为已完成能力，虚线为待办；各项能力服务于 MOM 与 EBC+商务两条核心路线</text></svg>
