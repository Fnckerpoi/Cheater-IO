<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">TurboIO 普通 V2：输出回调替换，官方语音链路保留</title>
  <desc id="desc">六节点源码流程。官方识别文字供给本轮问题；官方本轮 NLP 回包供给模板与路由，不等待完整答案。receiveNlp 不接管则交给 OriginalNlp；合格接管则用本轮问题启动模型 HTTP 文字流。emitText 使用 CopyResponse 复制官方回包的会话元数据、修改 answer 与 finished、清空 spoken，提交原回调；开启 TTS 后朗读。虚线从官方回包指向输出节点，仅表示模板依赖。没有取消官方服务器请求，也没有宣称镜片端验证成功。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker>
    <style>
      text { font-family: sans-serif; font-size: 14px; fill: #172033; }
      .heading { font-size: 18px; font-weight: 700; }
      .name { font-size: 16px; font-weight: 600; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.3; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#arrow); }
      .dependency { stroke-dasharray: 5 4; }
      .label { fill: #475569; }
      a text { text-decoration: underline; }
    </style>
  </defs>
  <rect width="720" height="360" fill="#ffffff"/>
