<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EA"/>
      <stop offset="0.55" stop-color="#FBE7C4"/>
      <stop offset="1" stop-color="#EFD3A2"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#FFF6E4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFF6E4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14181D"/>
      <stop offset="0.5" stop-color="#2C333C"/>
      <stop offset="1" stop-color="#10141A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1B2C34"/>
      <stop offset="1" stop-color="#0B1216"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9FFCB"/>
      <stop offset="0.45" stop-color="#4FE08A"/>
      <stop offset="1" stop-color="#1E9B6A"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#halo)"/>

  <!-- ground -->
  <ellipse cx="600" cy="908" rx="300" ry="30" fill="#8C6F45" opacity="0.30" filter="url(#soft)"/>
  <line x1="120" y1="906" x2="960" y2="906" stroke="#B79A6E" stroke-width="6" opacity="0.55"/>

  <!-- motion lines -->
  <g stroke="#C4AC82" stroke-width="11" stroke-linecap="round" opacity="0.75">
    <line x1="140" y1="470" x2="252" y2="470"/>
    <line x1="112" y1="562" x2="240" y2="562"/>
    <line x1="150" y1="654" x2="236" y2="654"/>
  </g>

  <!-- wifi arcs -->
  <g fill="none" stroke="#2FA86B" stroke-linecap="round">
    <path d="M 295,230 A 40,40 0 0 1 369,230" stroke-width="9" opacity="0.85"/>
    <path d="M 278,220 A 65,65 0 0 1 386,220" stroke-width="9" opacity="0.55"/>
    <path d="M 262,210 A 92,92 0 0 1 402,210" stroke-width="9" opacity="0.3"/>
    <path d="M 475,230 A 40,40 0 0 1 549,230" stroke-width="9" opacity="0.85"/>
    <path d="M 458,220 A 65,65 0 0 1 566,220" stroke-width="9" opacity="0.55"/>
    <path d="M 442,210 A 92,92 0 0 1 582,210" stroke-width="9" opacity="0.3"/>
  </g>

  <!-- ============ the 5080 workstation backpack ============ -->
  <g>
    <!-- antennas -->
    <g stroke="#0C1014" stroke-width="13" stroke-linecap="round">
      <line x1="345" y1="360" x2="332" y2="252"/>
      <line x1="505" y1="360" x2="518" y2="252"/>
    </g>
    <circle cx="332" cy="250" r="9" fill="#8DFFB0" filter="url(#glow)"/>
    <circle cx="518" cy="250" r="9" fill="#8DFFB0" filter="url(#glow)"/>

    <!-- tower body -->
    <rect x="300" y="352" width="250" height="450" rx="22" fill="url(#case)" stroke="#0C1014" stroke-width="9"/>
    <rect x="313" y="365" width="224" height="424" rx="15" fill="none" stroke="#454F5B" stroke-width="3"/>

    <!-- power led -->
    <circle cx="338" cy="386" r="11" fill="#8DFFB0" filter="url(#glow)"/>

    <!-- label plate -->
    <rect x="330" y="408" width="192" height="58" rx="9" fill="#0F141A" stroke="#556170" stroke-width="3"/>
    <text x="426" y="449" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="2" fill="#EAFBF0">RTX 5080</text>

    <!-- side window -->
    <rect x="330" y="486" width="192" height="242" rx="13" fill="url(#glass)" stroke="#0C1014" stroke-width="7"/>
    <!-- ram + cpu -->
    <rect x="344" y="502" width="18" height="72" rx="4" fill="#2E3E49"/>
    <rect x="370" y="502" width="18" height="72" rx="4" fill="#2E3E49"/>
    <rect x="430" y="506" width="76" height="66" rx="7" fill="#243139" stroke="#3E5563" stroke-width="3"/>
    <circle cx="468" cy="539" r="22" fill="#141C22" stroke="#4A6472" stroke-width="3"/>
    <!-- gpu -->
    <rect x="342" y="612" width="168" height="88" rx="9" fill="#17242C" stroke="#33505E" stroke-width="4"/>
    <circle cx="386" cy="656" r="27" fill="#0D1519" stroke="#41606F" stroke-width="3"/>
    <circle cx="466" cy="656" r="27" fill="#0D1519" stroke="#41606F" stroke-width="3"/>
    <g stroke="#5C7C8B" stroke-width="3" opacity="0.9">
      <line x1="386" y1="632" x2="386" y2="680"/><line x1="363" y1="656" x2="409" y2="656"/>
      <line x1="466" y1="632" x2="466" y2="680"/><line x1="443" y1="656" x2="489" y2="656"/>
    </g>
    <text x="352" y="606" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#7FD8A8">GDDR7 16G</text>
    <!-- rgb strip -->
    <rect x="342" y="710" width="168" height="9" rx="5" fill="#7CFF9B" opacity="0.85" filter="url(#glow)"/>

    <!-- carry handle -->
    <path d="M 372,352 C 380,318 470,318 478,352" fill="none" stroke="#171C22" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- ============ the human ============ -->
  <g>
    <!-- far arm -->
    <path d="M 612,548 L 574,616 L 622,652" fill="none" stroke="#B8441A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- legs -->
    <path d="M 600,762 L 545,846 L 492,884" fill="none" stroke="#2E3A46" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 642,762 L 716,846 L 776,884" fill="none" stroke="#374553" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="452" y="868" width="112" height="38" rx="18" fill="#14181D"/>
    <rect x="742" y="868" width="122" height="38" rx="18" fill="#14181D"/>

    <!-- torso -->
    <path d="M 585,505 C 552,545 545,640 562,716 L 585,784 L 702,784 L 724,700 C 744,625 730,545 692,505 Z"
          fill="#F2622B" stroke="#12161B" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 600,512 C 578,556 578,650 592,720 L 606,776" fill="none" stroke="#C9481A" stroke-width="7" opacity="0.8"/>

    <!-- neck -->
    <path d="M 632,466 L 632,514 L 690,514 L 690,466 Z" fill="#E0AC84" stroke="#12161B" stroke-width="6"/>

    <!-- head -->
    <circle cx="665" cy="415" r="72" fill="#F3C9A6" stroke="#12161B" stroke-width="8"/>
    <path d="M 722,438 L 774,456 L 714,472 Z" fill="#F3C9A6" stroke="#12161B" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="599" cy="430" r="15" fill="#E0AC84" stroke="#12161B" stroke-width="5"/>
    <!-- hair -->
    <path d="M 592,402 C 585,322 648,292 704,308 C 744,320 748,372 744,404 L 728,404 C 722,356 700,340 660,342 C 618,344 598,370 596,404 Z"
          fill="#2A2018" stroke="#12161B" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 596,404 C 588,430 590,452 600,468 L 588,470 C 578,448 578,420 586,398 Z" fill="#2A2018"/>
    <!-- strained mouth + brow -->
    <path d="M 668,478 q 15,11 30,-4" fill="none" stroke="#12161B" stroke-width="7" stroke-linecap="round"/>

    <!-- RayNeo iO glasses -->
    <path d="M 762,398 L 862,352 L 872,462 L 762,444 Z" fill="#A8FFC4" opacity="0.26"/>
    <rect x="636" y="392" width="128" height="58" rx="17" fill="#12171C" stroke="#05080B" stroke-width="6"/>
    <rect x="646" y="401" width="108" height="40" rx="12" fill="url(#lens)" filter="url(#glow)"/>
    <g stroke="#F4FFF8" stroke-width="4" opacity="0.75" stroke-linecap="round">
      <line x1="660" y1="412" x2="700" y2="412"/>
      <line x1="660" y1="424" x2="686" y2="424"/>
    </g>
    <text x="742" y="446" text-anchor="end" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#0B2A1A" opacity="0.85">iO</text>
    <path d="M 636,416 L 598,422" stroke="#12171C" stroke-width="13" stroke-linecap="round"/>
    <!-- floating HUD tile -->
    <g>
      <rect x="866" y="366" width="86" height="62" rx="10" fill="#E9FFF1" opacity="0.85" stroke="#2FA86B" stroke-width="4"/>
      <g stroke="#2FA86B" stroke-width="5" stroke-linecap="round" opacity="0.85">
        <line x1="880" y1="386" x2="938" y2="386"/>
        <line x1="880" y1="402" x2="920" y2="402"/>
      </g>
    </g>

    <!-- straps -->
    <path d="M 540,432 C 578,470 588,532 580,612 L 572,700" fill="none" stroke="#22282F" stroke-width="22" stroke-linecap="round"/>
    <path d="M 556,420 C 606,458 624,524 614,606 L 602,706" fill="none" stroke="#171C22" stroke-width="27" stroke-linecap="round"/>
    <rect x="592" y="592" width="46" height="32" rx="7" fill="#2C333B" stroke="#05080B" stroke-width="5"/>
    <!-- waist belt -->
    <path d="M 556,748 L 726,748" stroke="#171C22" stroke-width="26" stroke-linecap="round"/>
    <rect x="618" y="732" width="52" height="34" rx="7" fill="#2C333B" stroke="#05080B" stroke-width="5"/>

    <!-- near arm gripping strap -->
    <path d="M 692,545 L 758,614 L 652,618" fill="none" stroke="#E4571F" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="626" cy="614" r="22" fill="#F3C9A6" stroke="#12161B" stroke-width="6"/>
    <g fill="#F3C9A6" stroke="#12161B" stroke-width="5">
      <rect x="596" y="594" width="36" height="15" rx="7"/>
      <rect x="596" y="611" width="36" height="15" rx="7"/>
      <rect x="599" y="628" width="31" height="14" rx="7"/>
    </g>

    <!-- router on the hip: the LAN part -->
    <g>
      <path d="M 770,692 L 812,634" stroke="#0C1014" stroke-width="11" stroke-linecap="round"/>
      <path d="M 792,700 L 838,648" stroke="#0C1014" stroke-width="11" stroke-linecap="round"/>
      <g fill="none" stroke="#2FA86B" stroke-linecap="round" opacity="0.8">
        <path d="M 800,620 A 26,26 0 0 1 838,620" stroke-width="7"/>
        <path d="M 792,610 A 42,42 0 0 1 846,610" stroke-width="7" opacity="0.6"/>
      </g>
      <rect x="690" y="690" width="124" height="78" rx="13" fill="#F7F9FA" stroke="#12161B" stroke-width="7"/>
      <text x="752" y="722" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="21" fill="#12161B">Wi-Fi 6E</text>
      <g fill="#2A3038">
        <rect x="702" y="734" width="22" height="16" rx="3"/>
        <rect x="730" y="734" width="22" height="16" rx="3"/>
        <rect x="758" y="734" width="22" height="16" rx="3"/>
      </g>
      <circle cx="798" cy="706" r="6" fill="#2FA86B"/>
    </g>

    <!-- sweat -->
    <g fill="#7CC8FF" stroke="#12161B" stroke-width="4">
      <path d="M 786,326 c 14,18 14,30 2,34 c -12,4 -18,-10 -6,-28 z"/>
      <path d="M 806,398 c 12,16 12,26 2,29 c -10,3 -15,-9 -5,-24 z"/>
      <path d="M 762,282 c 11,14 11,23 2,25 c -9,3 -14,-8 -5,-21 z"/>
    </g>
  </g>

  <!-- ============ meme captions ============ -->
  <g font-family="PingFang SC, Hiragino Sans GB, Heiti SC, Arial Black, sans-serif" font-weight="900"
     text-anchor="middle" fill="#FFFFFF" stroke="#12161B" stroke-width="13" paint-order="stroke" stroke-linejoin="round">
    <text x="540" y="112" font-size="80" letter-spacing="3">什么叫真正的端侧推理</text>
    <text x="540" y="1002" font-size="94" letter-spacing="4">端，就是我自己</text>
  </g>
  <text x="1046" y="1052" text-anchor="end" font-family="PingFang SC, Arial, sans-serif" font-size="20" fill="#7A6647" opacity="0.85">Turbo IO · 雷鸟 iO 非官方 meme</text>
</svg>
