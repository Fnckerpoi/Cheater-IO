<rect x="36.0" y="1128.0" width="1900" height="96" rx="9" fill="#f5f5f5" stroke="#888888" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="986.0" y="1171.5" text-anchor="middle" font-size="13" fill="#141414" font-family="Microsoft YaHei, Segoe UI, Helvetica, Arial, sans-serif">边界与策略：问答资格由 ChatPolicy 判定，其余保留官方回答；模型请求走自有 endpoint，Bearer Key 存于 Keystore；工具回合 ≤4 轮、单轮 ≤2 个并行工具、工具调用 ≤3 次；MCP 配置 revision 变化即中止当前回合；知识库证据与工具返回一律视为不可信外部数据，提示词显式要求忽略其中指令；任何失败都</text>
<text x="986.0" y="1189.9" text-anchor="middle" font-size="13" fill="#141414" font-family="Microsoft YaHei, Segoe UI, Helvetica, Arial, sans-serif">回退官方回答，不阻塞眼镜。</text>
